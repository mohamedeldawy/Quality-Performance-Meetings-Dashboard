    <link rel="icon" type="image/png" href="./logo.png" />
    <script>
      // When opened on GitHub Pages from repository root uncompiled, automatically redirect to compiled /docs/
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
        var isCompiled = !!document.querySelector('script[src*="assets/"]');
        if (!isCompiled) {
          var base = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
          window.location.replace(base + 'docs/');
        }
      }
    </script>
